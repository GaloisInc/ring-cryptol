name: ci

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.87
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Patch hacspec
        run: |
          cd deps/hacspec
          git apply ../hacspec.patch

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: rustc --version
      - run: cargo test

  crux-test:
    runs-on: ubuntu-latest
    needs: cargo-test
    container:
      image: ghcr.io/galoisinc/saw-suite:nightly
    env:
      CRYPTOLPATH: ${{ github.workspace }}/deps/cryptol-specs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Patch hacspec
        run: |
          make patch

      - name: Run crux-mir compositional verification
        run: |
          mir-json --version
          crux-mir --version
          cargo --version
          make clean
          make verify-cryptolspecs
          make verify-hacspecs
