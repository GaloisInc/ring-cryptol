name: ci

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.87
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Patch hacspec
        run: |
          cd deps/hacspec
          git apply ../hacspec.patch

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: rustc --version
      - run: cargo test

  crux-test:
    runs-on: ubuntu-latest
    needs: cargo-test
    container:
      image: rust:1.87
    env:
      SAW_RUST_LIBRARY_PATH: ${{ github.workspace }}/saw-suite/rlibs
      CRUX_RUST_LIBRARY_PATH: ${{ github.workspace }}/saw-suite/rlibs
      CRYPTOLPATH: ${{ github.workspace }}/deps/cryptol-specs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Patch hacspec
        run: |
          cd deps/hacspec
          git apply ../hacspec.patch
          git status

      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Download saw-suite
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.SAW_SUITE_TOKEN }}
        run: ./.gitlab/download_saw_suite.sh

      - name: Run crux-mir compositional verification
        run: |
          export PATH="$PWD/saw-suite/bin:$PATH"
          echo "PATH=$PATH"
          echo "SAW_RUST_LIBRARY_PATH=$SAW_RUST_LIBRARY_PATH"
          echo "CRUX_RUST_LIBRARY_PATH=$CRUX_RUST_LIBRARY_PATH"
          echo "CRYPTOLPATH=$CRYPTOLPATH"
          mir-json --version
          crux-mir --version
          cargo --version
          CRUX_MIR=crux-mir-comp cargo crux-test --lib -- -s z3 -m
